
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عرض المرفق - One Time QR</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #f3f6fb; color: #172033; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px; }
    .card { background: #fff; border-radius: 20px; padding: 26px; box-shadow: 0 10px 30px rgba(23, 32, 51, 0.08); margin-bottom: 18px; }
    h1 { margin-top: 0; font-size: 26px; color: #1456d9; }
    .muted { color: #667085; }
    .icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 7px 12px; background: #e9f7ef; border-radius: 20px; color: #18794e; font-weight: bold; font-size: 14px; }
    .topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    #timer { font-size: 22px; font-weight: bold; color: #d92d20; background: #fef3f2; padding: 6px 14px; border-radius: 12px; }
    .viewer { border: 1px solid #eaecf0; border-radius: 14px; overflow: hidden; background: #fff; margin: 20px 0; }
    .viewer iframe { display: block; width: 100%; height: 70vh; min-height: 500px; border: 0; }
    .warning { padding: 14px; border-radius: 12px; background: #fff8e6; color: #7a5b00; border-right: 4px solid #f79009; }
    @media (max-width: 750px) {
      .card { padding: 20px; }
      .viewer iframe { min-height: 420px; height: 60vh; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- كارت عرض المرفق المباشر -->
    <div class="card" id="viewerCard">
      <div class="topline">
        <span class="badge">🔒 وصول مخصص لشخص واحد</span>
        <span id="timer">300</span>
      </div>
      <h1 id="fileName">اسم المرفق.pdf</h1>
      <p class="muted">الوقت المتبقي للوصول: <strong><span id="count">300</span> ثانية</strong></p>
      <div class="viewer">
        <iframe id="fileIframe" src="" title="المرفق"></iframe>
      </div>
      <div class="warning">
        ⚠️ <strong>تنبيه:</strong> هذا الوصول مؤقت لمرة واحدة فقط ومخصص لأول شخص قام بمسح الباركود.
      </div>
    </div>
  </main>
